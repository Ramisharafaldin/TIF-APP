<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}TIF App{% endblock %}</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+Arabic:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#FACC15", // Yellow-400
                        "primary-dark": "#EAB308", // Yellow-500
                        "app-bg": "#F0F9FF", // Sky-50
                        "app-sidebar": "#0C4A6E", // Sky-900
                        "surface": "#FFFFFF",
                        "border-color": "#BAE6FD", // Sky-200
                        "text-main": "#0C4A6E", // Sky-900
                        "text-muted": "#64748B", // Slate-500
                    },
                    fontFamily: {
                        "display": ["Noto Sans Arabic", "Inter", "sans-serif"],
                        "sans": ["Noto Sans Arabic", "Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem", 
                        "lg": "0.75rem", 
                        "xl": "1rem", 
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom Styles -->
    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F0F9FF; 
        }
        ::-webkit-scrollbar-thumb {
            background: #BAE6FD; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7DD3FC; 
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-app-bg text-text-main font-display antialiased overflow-x-hidden selection:bg-primary selection:text-text-main">
    {% block body %}{% endblock %}
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
